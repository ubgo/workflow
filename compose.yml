# Throwaway services for the live test suites that need Redis or a Hatchet
# engine. They are this repo's own, never the shared dev stack and never the
# system Docker: `task redis:test` and `task hatchet:test:live` start one
# profile, run, and remove the containers and their data with
# `docker compose --profile X down -v` through a Taskfile defer registered
# before the start, pass or fail. No volume is named, and every port binds to
# 127.0.0.1 on a number nothing else on the box listens on (35xxx-38xxx; the
# MySQL and Postgres profiles live in sqlstore/compose.yml on 33072/35432).
# The project name is fixed, so run one suite per profile at a time (the
# tasks take the machine-wide testlock).
name: ubgo-workflow-live

services:
  redis:
    profiles: [redis]
    image: redis:8-alpine
    ports: ["127.0.0.1:36379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # hatchet-lite needs a Postgres of its own; it is not the sqlstore one.
  hatchet-db:
    profiles: [hatchet]
    image: postgres:18
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
      POSTGRES_DB: hatchet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hatchet -d hatchet"]
      interval: 2s
      timeout: 3s
      retries: 60

  # Hatchet's single-node engine (API, UI and engine in one image). The gRPC
  # broadcast address is what the engine tells workers to dial, so it must be
  # the published host port, and the engine's own API dials that same address
  # from inside the container (cancel and replay go through it), so the gRPC
  # port is the same number inside and out. The credentials below are this container's own
  # and live for one run; the API token is minted by the task from inside the
  # container and never written down.
  hatchet:
    profiles: [hatchet]
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    depends_on:
      hatchet-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:38888:8888"
      - "127.0.0.1:37077:37077"
    environment:
      DATABASE_URL: postgresql://hatchet:hatchet@hatchet-db:5432/hatchet?sslmode=disable
      SERVER_AUTH_COOKIE_DOMAIN: localhost
      SERVER_AUTH_COOKIE_INSECURE: "t"
      SERVER_GRPC_BIND_ADDRESS: 0.0.0.0
      SERVER_GRPC_INSECURE: "t"
      SERVER_GRPC_BROADCAST_ADDRESS: localhost:37077
      SERVER_GRPC_PORT: "37077"
      SERVER_URL: http://localhost:38888
      SERVER_AUTH_SET_EMAIL_VERIFIED: "t"
      SERVER_DEFAULT_ENGINE_VERSION: V1
      SERVER_INTERNAL_CLIENT_INTERNAL_GRPC_BROADCAST_ADDRESS: localhost:37077
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/api/ready >/dev/null 2>&1 || curl -fs http://127.0.0.1:8888/api/ready >/dev/null"]
      interval: 3s
      timeout: 5s
      retries: 60
