  <rect x="37" y="628" width="173" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="123.5" y="650.2" font-size="12" fill="#1e293b" text-anchor="middle">in-process memory</text>
  <!-- your SQL database: x=235 y=628 w=173 h=36, right=408, bottom=664 -->
  <rect x="235" y="628" width="173" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="321.5" y="650.2" font-size="12" fill="#1e293b" text-anchor="middle">your SQL database</text>
  <!-- Hatchet engine: x=433 y=628 w=173 h=36, right=606, bottom=664 -->
  <rect x="433" y="628" width="173" height="36" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="519.5" y="650.2" font-size="12" fill="#1e293b" text-anchor="middle">Hatchet engine</text>
  <!-- Plugins: x=667 y=184 w=160 h=72, right=827, bottom=256 -->
  <rect x="667" y="184" width="160" height="72" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="747" y="206.2" font-size="12" fill="#1e293b" text-anchor="middle">Plugins</text>
  <text x="747" y="224.2" font-size="12" fill="#64748b" text-anchor="middle">workflow.Use(c, …)</text>
  <text x="747" y="242.2" font-size="12" fill="#64748b" text-anchor="middle">middleware + observers</text>
  <!-- Migrations: x=667 y=286 w=160 h=72, right=827, bottom=358 -->
  <rect x="667" y="286" width="160" height="72" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="747" y="308.2" font-size="12" fill="#1e293b" text-anchor="middle">Migrations</text>
  <text x="747" y="326.2" font-size="12" fill="#64748b" text-anchor="middle">sqlstore Migrate(ctx)</text>
  <text x="747" y="344.2" font-size="12" fill="#64748b" text-anchor="middle">versioned, explicit</text>
  <!-- Retention: x=667 y=388 w=160 h=72, right=827, bottom=460 -->
  <rect x="667" y="388" width="160" height="72" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="747" y="410.2" font-size="12" fill="#1e293b" text-anchor="middle">Retention</text>
  <text x="747" y="428.2" font-size="12" fill="#64748b" text-anchor="middle">WithRetention · Prune</text>
  <text x="747" y="446.2" font-size="12" fill="#64748b" text-anchor="middle">WithArchive</text>
  <!-- Observability: x=667 y=490 w=160 h=72, right=827, bottom=562 -->
  <rect x="667" y="490" width="160" height="72" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="747" y="512.2" font-size="12" fill="#1e293b" text-anchor="middle">Observability</text>
  <text x="747" y="530.2" font-size="12" fill="#64748b" text-anchor="middle">otel spans per step</text>
  <text x="747" y="548.2" font-size="12" fill="#64748b" text-anchor="middle">outcome metrics</text>
  <!-- Testing (workflowtest): x=667 y=592 w=160 h=72, right=827, bottom=664 -->
  <rect x="667" y="592" width="160" height="72" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="747" y="614.2" font-size="12" fill="#1e293b" text-anchor="middle">Testing (workflowtest)</text>
  <text x="747" y="632.2" font-size="12" fill="#64748b" text-anchor="middle">conformance suite</text>
  <text x="747" y="650.2" font-size="12" fill="#64748b" text-anchor="middle">Fake, Recorder</text>
