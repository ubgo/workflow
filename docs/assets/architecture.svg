  <path d="M242,710 L 266,710" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="284" y="713.5" font-size="10" fill="#64748b">execution and results, steps 6 to 10</text>
