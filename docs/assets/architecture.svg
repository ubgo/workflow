  <rect x="652" y="140" width="190" height="540" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="662" y="156" font-size="11" fill="#64748b">Plugins and operations</text>
  <path d="M164.5,115 L 164.5,129" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="152.5" y="128.5" font-size="10" fill="#1e40af" text-anchor="end">1  Enqueue · Schedule</text>
  <path d="M164.5,217 L 164.5,231" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="152.5" y="230.5" font-size="10" fill="#1e40af" text-anchor="end">2  caps checked</text>
  <path d="M164.5,319 L 164.5,333" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="152.5" y="332.5" font-size="10" fill="#1e40af" text-anchor="end">3  wrapped Enqueue</text>
  <path d="M164.5,447 L 164.5,461" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="152.5" y="460.5" font-size="10" fill="#1e40af" text-anchor="end">4  driver Enqueue</text>
  <path d="M164.5,575 L 164.5,589" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <text x="152.5" y="588.5" font-size="10" fill="#1e40af" text-anchor="end">5  run stored</text>
  <path d="M479.5,595 L 479.5,581" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="491.5" y="588.5" font-size="10" fill="#166534">6  worker claims run</text>
  <path d="M479.5,467 L 479.5,453" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="491.5" y="460.5" font-size="10" fill="#166534">7  step, run events</text>
  <path d="M479.5,339 L 479.5,325" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="491.5" y="332.5" font-size="10" fill="#166534">8  step attempt</text>
  <path d="M479.5,237 L 479.5,223" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="491.5" y="230.5" font-size="10" fill="#166534">9  wrapped step</text>
  <path d="M479.5,135 L 479.5,121" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="491.5" y="128.5" font-size="10" fill="#166534">10  step fn, run-finished</text>
  <!-- app: x=22 y=56 w=600 h=54, right=622, bottom=110 -->
  <rect x="22" y="56" width="600" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="322" y="78.2" font-size="12" fill="#1e40af" text-anchor="middle">Your app</text>
  <text x="322" y="96.2" font-size="12" fill="#64748b" text-anchor="middle">Register(workflow) · Start(ctx) · Enqueue(job) · Schedule(cron) · step functions</text>
  <!-- client API: x=22 y=140 w=600 h=72, right=622, bottom=212 -->
  <rect x="22" y="140" width="600" height="72" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="322" y="162.2" font-size="12" fill="#6b21a8" text-anchor="middle">workflow.Client</text>
  <text x="322" y="180.2" font-size="12" fill="#64748b" text-anchor="middle">Enqueue · Schedule · Signal · Status · Cancel · OnRunFinished</text>
  <text x="322" y="198.2" font-size="12" fill="#64748b" text-anchor="middle">Capabilities(): a backend declares what it can do, the rest is refused</text>
  <!-- enqueue mw: x=22 y=242 w=285 h=72, right=307, bottom=314 -->
  <rect x="22" y="242" width="285" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="164.5" y="264.2" font-size="12" fill="#b45309" text-anchor="middle">Enqueue middleware</text>
  <text x="164.5" y="282.2" font-size="12" fill="#64748b" text-anchor="middle">unique · debounce · route</text>
  <text x="164.5" y="300.2" font-size="12" fill="#64748b" text-anchor="middle">claim check · otel span</text>
  <!-- step mw: x=337 y=242 w=285 h=72, right=622, bottom=314 -->
  <rect x="337" y="242" width="285" height="72" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="479.5" y="264.2" font-size="12" fill="#b45309" text-anchor="middle">Step middleware</text>
  <text x="479.5" y="282.2" font-size="12" fill="#64748b" text-anchor="middle">logging · recovery · timeout</text>
  <text x="479.5" y="300.2" font-size="12" fill="#64748b" text-anchor="middle">codec · throttling · otel span</text>
  <!-- batch: x=37 y=372 w=173 h=54, right=210, bottom=426 -->
  <rect x="37" y="372" width="173" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="123.5" y="394.2" font-size="12" fill="#b45309" text-anchor="middle">batch</text>
  <text x="123.5" y="412.2" font-size="12" fill="#64748b" text-anchor="middle">Then · Catch · Finally</text>
  <!-- failover: x=235 y=372 w=173 h=54, right=408, bottom=426 -->
  <rect x="235" y="372" width="173" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="321.5" y="394.2" font-size="12" fill="#b45309" text-anchor="middle">failover</text>
  <text x="321.5" y="412.2" font-size="12" fill="#64748b" text-anchor="middle">primary, then secondary</text>
  <!-- outbox · EnqueueTx: x=433 y=372 w=173 h=54, right=606, bottom=426 -->
  <rect x="433" y="372" width="173" height="54" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="519.5" y="394.2" font-size="12" fill="#b45309" text-anchor="middle">outbox · EnqueueTx</text>
  <text x="519.5" y="412.2" font-size="12" fill="#64748b" text-anchor="middle">enqueue in your SQL tx</text>
  <!-- memory: x=37 y=500 w=173 h=54, right=210, bottom=554 -->
  <rect x="37" y="500" width="173" height="54" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="123.5" y="522.2" font-size="12" fill="#166534" text-anchor="middle">memory</text>
  <text x="123.5" y="540.2" font-size="12" fill="#64748b" text-anchor="middle">tests, one process</text>
  <!-- sqlstore: x=235 y=500 w=173 h=54, right=408, bottom=554 -->
  <rect x="235" y="500" width="173" height="54" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="321.5" y="522.2" font-size="12" fill="#166534" text-anchor="middle">sqlstore</text>
  <text x="321.5" y="540.2" font-size="12" fill="#64748b" text-anchor="middle">SQLite, Postgres, MySQL</text>
  <!-- hatchet: x=433 y=500 w=173 h=54, right=606, bottom=554 -->
  <rect x="433" y="500" width="173" height="54" rx="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="519.5" y="522.2" font-size="12" fill="#166534" text-anchor="middle">hatchet</text>
  <text x="519.5" y="540.2" font-size="12" fill="#64748b" text-anchor="middle">Hatchet Go SDK</text>
