<svg viewBox="0 0 864 736" width="864" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>
  <!-- White canvas so the figure reads as a card on dark pages. -->
  <rect x="0" y="0" width="864" height="736" fill="#ffffff"/>
  <text x="432" y="34" font-size="16" fill="#1e293b" text-anchor="middle">ubgo/workflow architecture</text>
  <!-- group Optional layers, each over any Client: x=22 y=344 w=600 h=98, bottom=442 -->
  <rect x="22" y="344" width="600" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="360" font-size="11" fill="#64748b">Optional layers, each over any Client</text>
  <!-- group Drivers (pick one per Client): x=22 y=472 w=600 h=98, bottom=570 -->
  <rect x="22" y="472" width="600" height="98" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="488" font-size="11" fill="#64748b">Drivers (pick one per Client)</text>
  <!-- group Storage / engine: x=22 y=600 w=600 h=80, bottom=680 -->
  <rect x="22" y="600" width="600" height="80" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text x="32" y="616" font-size="11" fill="#64748b">Storage / engine</text>
